name: Deploy Sriram Portfolio to GitHub Pages

on:
  push:
    branches:
      - "feature/shrinithi-insurance-landing-page-9868335872840530682"
    paths:
      - "portfolio-site/**"
      - ".github/workflows/deploy-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload portfolio website
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
